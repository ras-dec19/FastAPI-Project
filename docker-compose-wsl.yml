name: myapp-wsl

services:
  postgres:
    image: postgres:16-bookworm
    env_file:
      - ./.env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_db_wsl:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # build: .
    image: rasdec19/fastapi:myapp-wsl-api
    env_file:
      - ./.env.docker
    ports:
      - "8001:8000"
    command:
      [
        "gunicorn",
        "-w",
        "4",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "app.main:app",
        "--bind",
        "0.0.0.0:8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_db_wsl:
